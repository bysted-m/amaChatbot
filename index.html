<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask me anything chat bot - Martin Bysted</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <main>
        <section>
            <article>
                <img src="./assets/images/martinImg.jpg" alt="Billede af Martin Bysted">
                <h1>Ask me anything</h1>
                <div>
                    <span>x</span>
                    <p>questions asked</p>
                </div>
                <div>
                    <div>
                        <div>
                            <i class="fa-regular fa-comments"></i>
                        </div>
                        <p class="dimTxt">No questions yet.</p>
                        <p class="dimTxt">Type something below.</p>
                    </div>
                    <form id="amaForm">
                        <input type="text" placeholder="Ask me anything...">
                        <button type="submit"><span class="material-symbols-outlined">arrow-outward</span></button>

                    </form>
                </div>
            </article>
        </section>
    </main>
</body>

</html>
